server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: foodrescue-backend

  datasource:
    # Supabase PostgreSQL Database Connection
    # Uses connection pooling and SSL mode required by Supabase
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://db.djcwmdkenwcmsbcaqknc.supabase.co:5432/postgres?sslmode=require}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # Keep the existing Supabase schema intact - do not auto-drop or alter
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          lob:
            non_contextual_creation: true

# Supabase Keys & Configuration (kept exactly matching the Next.js client)
supabase:
  url: ${SUPABASE_URL:https://djcwmdkenwcmsbcaqknc.supabase.co}
  anon-key: ${SUPABASE_ANON_KEY:eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRqY3dtZGtlbndjbXNiY2Fxa25jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0NTczMzAsImV4cCI6MjEwNzAzMzMzMH0.uMRyBib86hrwPammKfCwYJQDXcaQJGuAaYhaW9XKAaA}
  jwt:
    # Supabase JWT Secret for signature verification
    secret: ${SUPABASE_JWT_SECRET:}

cors:
  allowed-origins:
    - "http://localhost:3000"
    - "http://127.0.0.1:3000"
    - "http://localhost:8080"
  allowed-methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
  allowed-headers:
    - "*"
  allow-credentials: true

# Actuator Health & Metrics
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    com.foodrescue: DEBUG
    org.springframework.security: INFO
